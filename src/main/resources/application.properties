spring.application.name=chat-application
spring.datasource.url=${CHAT_DATABASE_URL:jdbc:sqlite:chat.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000
spring.sql.init.mode=always
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
spring.security.oauth2.client.registration.github.client-id=${GH_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GH_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.registration.github.redirect-uri=${GH_OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
